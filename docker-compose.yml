services:
  wuog-scraper:
    build: .
    # image: ghcr.io/nkirchoff/wuog-docker:latest
    container_name: wuog_scraper
    restart: unless-stopped
    ports:
      - "1785:1785"
    volumes:
      - ./data:/app/data
      # - ./config.yaml:/app/config.yaml   # only if customizing views/semesters
    environment:
      - TZ=America/New_York
